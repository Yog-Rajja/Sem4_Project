<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/compass.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>Smart Companion</title>
    <script>
      // Set the theme before first paint so a dark-mode user never sees a
      // white flash while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('sc_theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          )
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

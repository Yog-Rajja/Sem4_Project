services:
  - type: web
    name: smart-companion-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: smart-companion-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*" # Or limit to frontend rendering domains
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      
databases:
  - name: smart-companion-db
    databaseName: smart_companion
    user: postgres
    plan: free
